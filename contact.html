<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Iqra<span class="logo-accent">.Rani</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section style="padding: 120px 20px 60px 20px; min-height: 80vh; max-width: 800px; margin: 0 auto;">
        <h2 class="section-title">Get In Touch</h2>
        <div class="about-card" style="padding: 30px;">
            <form action="#" method="post" style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; flex-direction: column; text-align: left;">
                    <label style="margin-bottom: 5px; font-weight: 500;">Your Name</label>
                    <input type="text" placeholder="Enter your full name" required style="padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff;">
                </div>
                <div style="display: flex; flex-direction: column; text-align: left;">
                    <label style="margin-bottom: 5px; font-weight: 500;">Your Email</label>
                    <input type="email" placeholder="Enter your email address" required style="padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff;">
                </div>
                <div style="display: flex; flex-direction: column; text-align: left;">
                    <label style="margin-bottom: 5px; font-weight: 500;">Message</label>
                    <textarea rows="5" placeholder="Write your message here..." required style="padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff;"></textarea>
                </div>
                <button type="submit" class="btn btn-glow" style="cursor: pointer; border: none; width: 100%; margin-top: 10px;">Send Message</button>
            </form>
        </div>
    </section>

    <footer id="contact">
        <div class="footer-content">
            <h2>Let's build something epic together!</h2>
            <div class="contact-links">
                <a href="https://linkedin.com" target="_blank" class="contact-btn"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
                <a href="mailto:iqraahmed69116@gmail.com" class="contact-btn"><i class="fa-solid fa-envelope"></i> Email Me</a>
            </div>
            <p class="copyright">&copy; 2026 Iqra Rani. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
